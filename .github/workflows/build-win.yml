name: Build Windows Driver

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 180

    env:
      VCPKG_ROOT: C:\vcpkg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify repo files
        shell: cmd
        run: |
          dir
          dir scripts
          if not exist "scripts\install_msvc_dlls.cmd" (
            echo "Missing script: scripts\install_msvc_dlls.cmd"
            exit /b 1
          )

      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-autotools
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-tools-git
            mingw-w64-ucrt-x86_64-ntldd

      - name: Install vcpkg
        shell: cmd
        run: |
          if not exist C:\vcpkg (
            git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          )
          C:\vcpkg\bootstrap-vcpkg.bat

      - name: Install vcpkg dependencies
        shell: cmd
        working-directory: ${{ github.workspace }}
        run: |
          call scripts\install_msvc_dlls.cmd

      - name: Check installed libusb
        shell: cmd
        run: |
          dir third_party\vcpkg_installed\x64-windows\bin
          if not exist "third_party\vcpkg_installed\x64-windows\bin\libusb-1.0.dll" (
            echo "Missing libusb-1.0.dll"
            exit /b 1
          )
          dumpbin /exports "third_party\vcpkg_installed\x64-windows\bin\libusb-1.0.dll" | findstr /I "libusb_"

      - name: Configure CMake
        shell: cmd
        run: |
          cmake -S . -B build

      - name: Build USB shim
        shell: cmd
        run: |
          cmake --build build --config Release --target bridge_usb

      - name: Build libsigrok in MSYS2 UCRT64
        shell: pwsh
        run: |
          & "C:\msys64\usr\bin\env.exe" MSYSTEM=UCRT64 CHERE_INVOKING=1 /usr/bin/bash -lc "sh scripts/build_libsigrok.sh"

      - name: Fetch sigrok firmware
        shell: pwsh
        run: |
          & "C:\msys64\usr\bin\env.exe" MSYSTEM=UCRT64 CHERE_INVOKING=1 /usr/bin/bash -lc "sh scripts/fetch_sigrok_firmware.sh"

      - name: Final build
        shell: cmd
        run: |
          cmake -S . -B build
          cmake --build build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitoscope-sigrok-bridge-win
          path: |
            build/drivers/**
            build/**/sigrok-firmware/**
